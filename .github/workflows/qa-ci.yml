name: QA & Automated Testing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa_audit_and_test:
    name: Automated QA, Security & Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Checking
        run: npm run typecheck

      - name: ESLint Code Quality Scan
        run: npm run lint
        continue-on-error: true

      - name: Execute Vitest Business Logic & Security Tests
        run: npm run test:unit

      - name: Compile Production Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E & Functional Suite
        run: npm run test:e2e
        env:
          CI: true

      - name: Run Dependency Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: qa/playwright-report/
          retention-days: 14
